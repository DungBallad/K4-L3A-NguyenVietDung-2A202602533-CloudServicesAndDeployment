name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_cp5 gọi vào bản deploy đang sống, test_bonus_cicd kiểm tra badge của
      # chính workflow này; các test build image đã có job `build` lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests -v
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Image size
        run: docker images day12-agent:${{ github.sha }}

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://day12-agent-b9uz.onrender.com' }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Chưa có secret RENDER_DEPLOY_HOOK_URL (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test
        run: |
          sleep 90
          for i in $(seq 1 10); do
            if curl -fsS --max-time 60 "$PUBLIC_URL/health"; then
              echo
              curl -fsS --max-time 30 "$PUBLIC_URL/ready"
              echo
              exit 0
            fi
            echo "Chưa sẵn sàng, thử lại sau 15 giây ($i/10)"
            sleep 15
          done
          exit 1
